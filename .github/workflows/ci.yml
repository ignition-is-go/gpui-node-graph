name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  publish-dry-run:
    name: crates.io publish dry run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux GPUI libraries
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-x11-dev libfontconfig1-dev libwayland-dev libx11-xcb-dev libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev
      - name: Verify node-graph-core is publishable
        run: cargo publish --dry-run --locked --allow-dirty -p node-graph-core
      - name: Verify gpui-node-graph is publishable
        run: cargo publish --dry-run --locked --allow-dirty -p gpui-node-graph --config 'patch.crates-io.node-graph-core.path="crates/node-graph-core"'

  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt, clippy, rust-src
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-x11-dev libfontconfig1-dev libwayland-dev libx11-xcb-dev libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev xvfb mesa-vulkan-drivers
      - run: cargo fmt --all -- --check
      - run: cargo check --workspace --all-targets
      - name: Verify Linux window backends
        if: runner.os == 'Linux'
        run: |
          cargo tree -e features -i gpui-linux-gpui-unofficial | grep -F 'gpui-linux-gpui-unofficial feature "wayland"'
          cargo tree -e features -i gpui-linux-gpui-unofficial | grep -F 'gpui-linux-gpui-unofficial feature "x11"'
      - run: cargo test --workspace
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Sustain native GPUI demo under Xvfb
        if: runner.os == 'Linux'
        shell: bash
        run: |
          cargo build -p gpui-node-graph-demo
          set +e
          LIBGL_ALWAYS_SOFTWARE=1 WGPU_BACKEND=vulkan \
            timeout 6s xvfb-run -a target/debug/gpui-node-graph-demo
          status=$?
          set -e
          test "$status" -eq 124

  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          targets: wasm32-unknown-unknown
          components: rust-src
      - uses: taiki-e/install-action@v2
        with:
          tool: trunk
      - run: cargo check --workspace --target wasm32-unknown-unknown
      - run: cd examples/demo && env -u NO_COLOR trunk build --release
