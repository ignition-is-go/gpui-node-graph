name: CI
on: [push, pull_request]
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt, clippy, rust-src
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-x11-dev libfontconfig1-dev libwayland-dev libx11-xcb-dev libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev xvfb mesa-vulkan-drivers
      - run: cargo fmt --all -- --check
      - run: cargo check --workspace --all-targets
      - name: Verify Linux window backends
        if: runner.os == 'Linux'
        run: |
          cargo tree -e features -i gpui_linux | grep -F 'gpui_linux feature "wayland"'
          cargo tree -e features -i gpui_linux | grep -F 'gpui_linux feature "x11"'
      - run: cargo test --workspace
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Sustain native GPUI demo under Xvfb
        if: runner.os == 'Linux'
        shell: bash
        run: |
          cargo build -p gpui-node-graph-demo
          set +e
          LIBGL_ALWAYS_SOFTWARE=1 WGPU_BACKEND=vulkan \
            timeout 6s xvfb-run -a target/debug/gpui-node-graph-demo
          status=$?
          set -e
          test "$status" -eq 124

  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          targets: wasm32-unknown-unknown
          components: rust-src
      - uses: taiki-e/install-action@v2
        with:
          tool: trunk
      - name: Install browser parity dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb x11-utils mesa-vulkan-drivers python3-pil
          curl -fsSLo /tmp/google-chrome.deb \
            https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
          sudo apt-get install -y /tmp/google-chrome.deb
      - run: cargo check --workspace --target wasm32-unknown-unknown
      - run: cd examples/demo && env -u NO_COLOR trunk build --release
      - name: Execute built WASM in Google Chrome under Xvfb
        shell: bash
        run: |
          python3 .github/scripts/serve_dist.py examples/demo/dist > /tmp/node-graph-server.log 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 90); do
            if curl -fsS -D /tmp/headers http://127.0.0.1:8181/ -o /tmp/index.html; then
              break
            fi
            if ! kill -0 "$server" 2>/dev/null; then
              cat /tmp/node-graph-server.log
              exit 1
            fi
            sleep 1
          done
          test -s /tmp/index.html || { cat /tmp/node-graph-server.log; exit 1; }
          grep -qi '^cross-origin-opener-policy: same-origin' /tmp/headers
          grep -qi '^cross-origin-embedder-policy: require-corp' /tmp/headers
          Xvfb :99 -screen 0 1280x800x24 -ac +extension GLX +render -noreset \
            > /tmp/node-graph-xvfb.log 2>&1 &
          xvfb=$!
          export DISPLAY=:99
          for attempt in $(seq 1 30); do
            if xdpyinfo >/dev/null 2>&1; then
              break
            fi
            if ! kill -0 "$xvfb" 2>/dev/null; then
              cat /tmp/node-graph-xvfb.log
              exit 1
            fi
            sleep 1
          done
          xdpyinfo >/dev/null 2>&1 || { cat /tmp/node-graph-xvfb.log; exit 1; }
          export LIBGL_ALWAYS_SOFTWARE=1
          chrome_path="$(command -v google-chrome-stable)"
          setsid "$chrome_path" \
            --ozone-platform=x11 --no-sandbox --no-first-run --no-default-browser-check \
            --disable-dev-shm-usage --enable-unsafe-webgpu \
            --enable-features=Vulkan --disable-features=UseSkiaRenderer \
            --use-angle=vulkan --use-webgpu-adapter=swiftshader \
            --window-position=0,0 --window-size=1200,800 \
            --remote-debugging-address=127.0.0.1 --remote-debugging-port=9222 \
            --user-data-dir=/tmp/node-graph-chrome http://127.0.0.1:8181/ \
            > /tmp/node-graph-chrome.log 2>&1 &
          chrome=$!
          trap 'kill -TERM -- -"$chrome" 2>/dev/null || true; kill "$xvfb" "$server" 2>/dev/null || true' EXIT
          if ! timeout 75 node .github/scripts/check_browser.mjs \
            http://127.0.0.1:8181/ 9222 /tmp/gpui-initial.png; then
            cat /tmp/node-graph-chrome.log
            exit 1
          fi
          python3 .github/scripts/compare_pixels.py \
            audits/goldens/leptos-initial-1200x661.png /tmp/gpui-initial.png
          python3 .github/scripts/compare_pixels.py \
            audits/goldens/leptos-selected-1200x661.png /tmp/gpui-initial-selected.png
          python3 .github/scripts/compare_pixels.py \
            audits/goldens/leptos-overlay-1200x661.png /tmp/gpui-initial-overlay.png
          python3 .github/scripts/compare_pixels.py \
            audits/goldens/leptos-menu-1200x661.png /tmp/gpui-initial-menu.png
      - name: Upload browser parity frame
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gpui-node-graph-initial-frame
          path: /tmp/gpui-initial*.png
