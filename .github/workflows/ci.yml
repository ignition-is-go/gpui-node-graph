name: CI
on: [push, pull_request]
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt, clippy, rust-src
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-x11-dev libfontconfig1-dev libwayland-dev libx11-xcb-dev libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev
      - run: cargo fmt --all -- --check
      - run: cargo check --workspace --all-targets
      - run: cargo test --workspace
      - run: cargo clippy --workspace --all-targets -- -D warnings

  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          targets: wasm32-unknown-unknown
          components: rust-src
      - uses: taiki-e/install-action@v2
        with:
          tool: trunk
      - run: cargo check --workspace --target wasm32-unknown-unknown
      - run: cd examples/demo && env -u NO_COLOR trunk build --release
      - name: Smoke-test browser host and isolation headers
        working-directory: examples/demo
        shell: bash
        run: |
          setsid env -u NO_COLOR trunk serve > /tmp/node-graph-trunk.log 2>&1 < /dev/null &
          server=$!
          trap 'kill $server' EXIT
          curl --retry 60 --retry-connrefused --retry-delay 1 -fsS -D /tmp/headers http://127.0.0.1:8181/ -o /tmp/index.html
          grep -qi '^cross-origin-opener-policy: same-origin' /tmp/headers
          grep -qi '^cross-origin-embedder-policy: require-corp' /tmp/headers
          grep -q 'gpui-node-graph-demo' /tmp/index.html
          asset=$(grep -oE 'gpui-node-graph-demo-[^" ]+_bg\.wasm' /tmp/index.html | head -1)
          test -n "$asset"
          curl -fsS "http://127.0.0.1:8181/$asset" -o /dev/null
