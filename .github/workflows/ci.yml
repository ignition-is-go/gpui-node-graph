name: CI
on: [push, pull_request]
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt, clippy, rust-src
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-x11-dev libfontconfig1-dev libwayland-dev libx11-xcb-dev libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev
      - run: cargo fmt --all -- --check
      - run: cargo check --workspace --all-targets
      - run: cargo test --workspace
      - run: cargo clippy --workspace --all-targets -- -D warnings

  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          targets: wasm32-unknown-unknown
          components: rust-src
      - uses: taiki-e/install-action@v2
        with:
          tool: trunk
      - name: Install Google Chrome
        id: setup-chrome
        uses: browser-actions/setup-chrome@v1
      - run: cargo check --workspace --target wasm32-unknown-unknown
      - run: cd examples/demo && env -u NO_COLOR trunk build --release
      - name: Execute built WASM in headless Google Chrome
        shell: bash
        run: |
          python3 .github/scripts/serve_dist.py examples/demo/dist > /tmp/node-graph-server.log 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 90); do
            if curl -fsS -D /tmp/headers http://127.0.0.1:8181/ -o /tmp/index.html; then
              break
            fi
            if ! kill -0 "$server" 2>/dev/null; then
              cat /tmp/node-graph-server.log
              exit 1
            fi
            sleep 1
          done
          test -s /tmp/index.html || { cat /tmp/node-graph-server.log; exit 1; }
          grep -qi '^cross-origin-opener-policy: same-origin' /tmp/headers
          grep -qi '^cross-origin-embedder-policy: require-corp' /tmp/headers
          "${{ steps.setup-chrome.outputs.chrome-path }}" \
            --headless=new --no-sandbox --disable-gpu \
            --enable-unsafe-swiftshader --disable-dev-shm-usage \
            --virtual-time-budget=15000 --dump-dom \
            http://127.0.0.1:8181/ > /tmp/dom.html
          cat /tmp/dom.html
          grep -q 'data-trunk-application-started="true"' /tmp/dom.html
          grep -q 'data-cross-origin-isolated="true"' /tmp/dom.html
          grep -q 'data-gpui-canvas="true"' /tmp/dom.html
          grep -q '<canvas' /tmp/dom.html
