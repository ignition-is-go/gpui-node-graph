[package]
name = "node-graph-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Domain-neutral graph document and editing model for node-graph UIs"
repository = "https://github.com/ignition-is-go/gpui-node-graph"

[package.metadata.flux]
tasks = ["build", "publish"]

[dependencies]
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
serde_json = "1"
