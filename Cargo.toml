[workspace]
members = ["crates/node-graph-core", "crates/gpui-node-graph", "examples/demo"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[workspace.dependencies]
gpui = { git = "https://github.com/zed-industries/zed.git" }
gpui_platform = { git = "https://github.com/zed-industries/zed.git", features = ["wayland", "x11"] }
gpui_web = { git = "https://github.com/zed-industries/zed.git" }
node-graph-core = { path = "crates/node-graph-core" }
gpui-node-graph = { path = "crates/gpui-node-graph" }
